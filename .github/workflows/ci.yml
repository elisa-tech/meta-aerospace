---
name: CI

"on":
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  clone-and-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      checks: write
      statuses: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prep
        run: ls -la

